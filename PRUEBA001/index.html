<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Mapa de la Memoria</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>
  <style>
    #map { height: 100vh; margin: 0; padding: 0; }
    body { margin: 0; }
  </style>
</head>
<body>
  <div id="map"></div>
  <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
  <script>
    // Crear el mapa centrado en Entre Ríos
    var map = L.map('map').setView([-32.468, -59.350], 7);

    // Capa base
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '&copy; OpenStreetMap contributors'
    }).addTo(map);

    // Cargar GeoJSON
    fetch('mapa_5_ejemplos.geojson')
      .then(response => response.json())
      .then(data => {
        L.geoJSON(data, {
          onEachFeature: function (feature, layer) {
            let props = feature.properties;
            let contenido = `<h3>${props.nombre || "Sin nombre"}</h3>
                             <p>${props.descripcion || "Sin descripción"}</p>`;
            if (props.foto) {
              contenido += `<img src="${props.foto}" width="100">`;
            }
            layer.bindPopup(contenido);
          }
        }).addTo(map);
      });
  </script>
</body>
</html>
