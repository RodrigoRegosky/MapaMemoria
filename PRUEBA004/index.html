<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mapa de Desaparecides Entrerrianes</title>

  <!-- CSS de Leaflet -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

  <style>
    body, html {
      margin: 0;
      padding: 0;
      height: 100%;
    }
    #map {
      height: 100vh;
      width: 100%;
    }
    .leaflet-popup-content {
      white-space: pre-line;
      font-family: Arial, sans-serif;
    }
    .legend {
      position: absolute;
      top: 10px;
      right: 10px;
      background: white;
      padding: 12px;
      border-radius: 8px;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.3);
      font-size: 14px;
      z-index: 1000;
      max-width: 220px;
    }
    .legend h4 {
      margin: 0 0 8px 0;
      font-size: 16px;
    }
    .legend div {
      display: flex;
      align-items: center;
      margin-bottom: 6px;
    }
    .legend img {
      width: 20px;
      height: 20px;
      margin-right: 10px;
    }
    .legend p {
      margin: 0;
    }
  </style>
</head>
<body>
  <div id="map"></div>

  <div class="legend">
    <h4>Leyenda</h4>
    <div><img src="huella_roja.png" alt="Huella roja"> <p>Personas desaparecidas</p></div>
    <div><img src="huella_verde.png" alt="Huella verde"> <p>Organismos de DDHH</p></div>
    <div><img src="huella_azul.png" alt="Huella azul"> <p>Espacios de memoria</p></div>
    <div><img src="huella_dorada.png" alt="Huella dorada"> <p>Madres / CDD</p></div>
  </div>

  <!-- JS de Leaflet -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <script>
    // 1. Inicializar el mapa
    const map = L.map('map').setView([-32.0, -60.0], 7); // Ajustado centro en Entre Ríos

    // 2. Fondo CartoDB Light (sin espacios en URL)
    L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
      attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> &copy; <a href="https://carto.com/attributions">CARTO</a>',
      subdomains: 'abcd',
      maxZoom: 18
    }).addTo(map);

    // 3. Capas
    const capas = {
      "Personas desaparecidas": L.layerGroup(),
      "Organismos de DDHH": L.layerGroup(),
      "Espacios de memoria": L.layerGroup(),
      "Madres / CDD": L.layerGroup()
    };

    // Añadir todas las capas al mapa (pero no visibles aún hasta que se agreguen marcadores)
    Object.values(capas).forEach(layer => layer.addTo(map));

    // 4. Iconos personalizados
    const iconos = {
      red: L.icon({
        iconUrl: 'huella_roja.png',
        iconSize: [32, 32],
        iconAnchor: [16, 32],
        popupAnchor: [0, -32]
      }),
      green: L.icon({
        iconUrl: 'huella_verde.png',
        iconSize: [32, 32],
        iconAnchor: [16, 32],
        popupAnchor: [0, -32]
      }),
      blue: L.icon({
        iconUrl: 'huella_azul.png',
        iconSize: [32, 32],
        iconAnchor: [16, 32],
        popupAnchor: [0, -32]
      }),
      gold: L.icon({
        iconUrl: 'huella_dorada.png',
        iconSize: [32, 32],
        iconAnchor: [16, 32],
        popupAnchor: [0, -32]
      }),
      gray: L.icon({
        iconUrl: 'huella_gris.png',
        iconSize: [32, 32],
        iconAnchor: [16, 32],
        popupAnchor: [0, -32]
      })
    };

    // Mapeo de colores a categorías
    const colorToCategory = {
      "red": "Personas desaparecidas",
      "green": "Organismos de DDHH",
      "blue": "Espacios de memoria",
      "gold": "Madres / CDD"
    };

    // Coordenadas para ajustar la vista tras cargar
    const bounds = [];

    // 5. Cargar GeoJSON
    fetch('mapa_desaparecides_entrerrianes4.geojson')
      .then(response => {
        if (!response.ok) throw new Error('No se pudo cargar el archivo GeoJSON');
        return response.json();
      })
      .then(data => {
        data.features.forEach(feature => {
          const coords = feature.geometry?.coordinates;
          if (!coords || coords.length < 2) return;

          const [lng, lat] = coords; // GeoJSON: [long, lat]
          if (!lat || !lng) return;

          // Guardar para ajustar vista después
          bounds.push([lat, lng]);

          // Obtener color desde uMap u otra propiedad
          const rawColor = feature.properties?._umap_options?.color || 'gray';
          const color = rawColor.toLowerCase().trim().replace('#', '') === 'dc3545' ? 'red' : // rojo bootstrap
                        rawColor.toLowerCase().includes('green') ? 'green' :
                        rawColor.toLowerCase().includes('blue') ? 'blue' :
                        rawColor.toLowerCase().includes('gold') || rawColor.toLowerCase().includes('yellow') ? 'gold' :
                        'gray';

          const category = colorToCategory[color] || "Personas desaparecidas"; // por defecto
          const icon = iconos[color] || iconos.gray;

          // Propiedades del marcador
          const name = feature.properties?.name || "Sin nombre";
          const desc = feature.properties?.description || "Sin descripción";
          const fecha = feature.properties?.fecha || "Fecha desconocida";
          const foto = feature.properties?.foto || null;

          // HTML del popup
          let popupContent = `
            <div style="max-width: 280px; font-family: Arial, sans-serif;">
              <h3 style="margin: 0 0 8px 0; color: ${color};">${name}</h3>
              <p style="margin: 0 0 8px 0;">${desc}</p>
              <p style="margin: 0 0 8px 0;"><strong>Fecha:</strong> ${fecha}</p>
          `;
          if (foto) {
            popupContent += `<img src="${foto}" alt="Foto de ${name}" style="width:100%; height:auto; margin:8px 0; border-radius:6px;" />`;
          }
          popupContent += `</div>`;

          // Crear marcador
          const marker = L.marker([lat, lng], { icon }).bindPopup(popupContent);

          // Añadir a capa correspondiente
          if (capas[category]) {
            marker.addTo(capas[category]);
          } else {
            marker.addTo(map); // fallback
          }
        });

        // Ajustar vista al área con datos
        if (bounds.length > 0) {
          map.fitBounds(bounds, { padding: [50, 50] });
        }

        // Control de capas
        L.control.layers(null, capas, {
          collapsed: false,
          position: 'topleft'
        }).addTo(map);

      })
      .catch(error => {
        console.error('Error al cargar el GeoJSON:', error);
        alert('No se pudo cargar el mapa de desaparecides. Intenta más tarde.');
      });
  </script>
</body>
</html>
